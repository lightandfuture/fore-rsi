[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.13,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "fore-rsi"
version = "0.0.1"
description = "An RSI framework for agent teams that explore, execute, and improve through feedback."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "terminal/LICENSE",
    "terminal/vendor/libghostty-vt/LICENSE",
    "terminal/vendor/portable-pty/LICENSE.md",
]
dependencies = ["loguru>=0.8,<1", "tyro>=1.0.17,<2"]

[project.scripts]
fore-rsi = "fore_rsi.__main__:cli"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["fore_rsi", "fore_rsi.*"]
namespaces = false
